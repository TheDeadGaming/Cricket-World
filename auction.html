<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IPL Auction - Cricket World</title><link rel="stylesheet" href="css/style.css"></head>
<body><header><a href="index.html" class="logo">🏏 Cricket World</a></header><main class="page">
<section id="teamSelect" class="panel"><h1>🔨 IPL Auction</h1><p class="hint">Choose your team.</p><div id="teams" class="team-grid"></div></section>
<section id="auction" class="panel hidden"><div class="auction-head"><div>TEAM<strong id="teamName"></strong></div><div>PURSE<strong>₹<span id="purse">120</span> Cr</strong></div><div>BOUGHT<strong id="count">0</strong></div></div>
<div class="player-card"><div id="category"></div><h1 id="player"></h1><p id="number"></p></div>
<div class="bid-row"><button onclick="bid(2)">BID ₹2 Cr</button><button onclick="bid(5)">BID ₹5 Cr</button><button onclick="bid(10)">BID ₹10 Cr</button><button onclick="bid(20)">BID ₹20 Cr</button><button class="skip" onclick="skip()">SKIP</button></div><p id="result" class="result-box"></p></section>
<section id="summary" class="panel hidden"><h1 id="summaryTeam"></h1><h2>Players Bought</h2><div id="squad"></div><button onclick="location.reload()">NEW AUCTION</button></section>
</main><footer>Made by Khushant</footer><script src="js/auction.js"></script></body></html>
