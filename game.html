<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cricket World</title><link rel="stylesheet" href="css/style.css"></head><body>
<header><a class="logo" href="index.html">🏏 Cricket World</a></header><main class="page"><section class="panel">
<h1 id="title">Cricket</h1><p id="rules" class="hint"></p>
<div id="toss"><h2>Coin Toss</h2><p>Choose Heads or Tails.</p><div class="buttons two"><button id="headsBtn">HEADS</button><button id="tailsBtn">TAILS</button></div><p id="tossResult"></p>
<div id="decision" class="hidden"><h2>You won the toss!</h2><p>Choose what to do:</p><div class="buttons two"><button id="batBtn">🏏 BAT</button><button id="bowlBtn">🎯 BOWL</button></div></div></div>
<div id="match" class="hidden"><div class="scoreboard"><div>SCORE<strong id="score">0/0</strong></div><div>OVERS<strong id="overs">0.0</strong></div><div>TARGET<strong id="target">—</strong></div></div>
<div class="pitch">🏟️ 🏏<span id="message"></span></div><div id="controls"></div></div>
</section></main><footer>Made by Khushant</footer><script src="js/game.js"></script></body></html>
